spring.application.name=activitepratique2
# Enable the H2 console
spring.h2.console.enabled=true
# Customize the console access path (default is /h2-console)
spring.h2.console.path=/h2-console
# JDBC URL for an in-memory database (default name 'testdb')
spring.datasource.url=jdbc:h2:mem:activitie2Db
spring.datasource.username=sa
spring.datasource.password=
# DDL auto-generation (create/update/none/create-drop)
spring.jpa.hibernate.ddl-auto=update 


spring.security.oauth2.client.registration.keycloak.client-id=products-client
spring.security.oauth2.client.registration.keycloak.client-secret=<SECRET>
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/products-realm
