spring.application.name=activitepratique2
# Enable the H2 console
spring.h2.console.enabled=true
# Customize the console access path (default is /h2-console)
spring.h2.console.path=/h2-console
# JDBC URL for an in-memory database (default name 'testdb')
spring.datasource.url=jdbc:h2:mem:activitie2Db
spring.datasource.username=sa
spring.datasource.password=
# DDL auto-generation (create/update/none/create-drop)
spring.jpa.hibernate.ddl-auto=update 
