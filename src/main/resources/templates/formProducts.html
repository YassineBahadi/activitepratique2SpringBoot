<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <link rel="stylesheet" href="webjars/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body>
    <h1>Add Product</h1>
    <form th:action="@{/save}" method="post" th:object="${product}">
        <div class="mb-3">
            <label for="">Name</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="">Price</label>
            <input type="text" th:field="*{price}" class="form-control">
            <div class="text-danger" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="">Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control">
            <div class="text-danger" th:errors="*{quantity}"></div>
        </div>

        <button class="btn btn-success"> Save</button>
    </form>
</body>
</html>
